<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alam Indah Selaras — Blok D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5233">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alam Indah Selaras">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<style>
:root{
  --bg:#F5F6F0; --card:#FFFFFF; --ink:#1E271F; --muted:#6C7566; --line:#E2E5DA;
  --primary:#2F5233; --primary-ink:#EFF4EC; --gold:#B0812F; --terra:#A8462F; --info:#3D6B8C;
  --paid:#2F5233; --unpaid:#B0812F; --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --kosong-bg:#6C7566; --belum-bg:#ECEEE4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141812; --card:#1C221A; --ink:#EDEFE8; --muted:#9AA391; --line:#2B3327; --primary:#7FAE83; --primary-ink:#12190F; --kosong-bg:#3E463D; --belum-bg:#20261D; }
}
:root[data-theme="dark"]{ --bg:#141812; --card:#1C221A; --ink:#EDEFE8; --muted:#9AA391; --line:#2B3327; --primary:#7FAE83; --primary-ink:#12190F; --kosong-bg:#3E463D; --belum-bg:#20261D; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,.brand{font-family:var(--serif);}
.hide{display:none!important;}

/* ---------- LOGIN ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.login-card{max-width:340px;width:100%;text-align:center;}
.login-card .mark{width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;}
.login-card h1{font-size:22px;margin:0 0 2px;font-weight:600;}
.login-card p{color:var(--muted);font-size:13px;margin:0 0 22px;}
.role-pick{display:flex;gap:8px;margin-bottom:16px;}
.role-pick button{flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--sans);}
.role-pick button.sel{border-color:var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:600;}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;margin-bottom:10px;font-family:var(--sans);}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.login-foot{margin-top:16px;font-size:11px;color:var(--muted);}

/* ---------- APP SHELL ---------- */
#app header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;z-index:10;display:flex;align-items:center;gap:10px;}
.mark-sm{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
#app header .t h1{font-size:15px;margin:0;line-height:1.2;font-weight:600;}
#app header .t p{font-size:11px;color:var(--muted);margin:1px 0 0;}
#roleTag{margin-left:auto;font-size:10px;background:var(--line);color:var(--muted);padding:4px 9px;border-radius:20px;white-space:nowrap;}

main{padding:16px 16px 90px;max-width:640px;margin:0 auto;}
.tab{display:none;} .tab.active{display:block;}
.section-title{font-size:13px;color:var(--muted);margin:22px 0 10px;font-weight:600;}
.section-title:first-child{margin-top:0;}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
.stat b{display:block;font-size:21px;font-weight:600;} .stat span{font-size:11px;color:var(--muted);}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600;}
.item{padding:10px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;padding-bottom:0;}
.item:first-child{padding-top:0;}
.item .meta{font-size:11px;color:var(--muted);margin-top:2px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding-bottom:8px;}
th:first-child{text-align:left;}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:center;}
td:first-child{text-align:left;}
.who{font-weight:600;} .who small{display:block;font-weight:400;color:var(--muted);}
.pill{display:inline-block;width:34px;height:22px;border-radius:20px;font-size:10px;line-height:22px;color:#fff;cursor:pointer;border:none;font-weight:600;}
.p-lunas{background:var(--paid);} .p-belum{background:var(--unpaid);} .p-off{background:var(--line);color:var(--muted);cursor:default;}

.segmented{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:14px;}
.segmented button{flex:1;border:none;background:transparent;padding:8px 3px;border-radius:8px;font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--sans);font-weight:600;}
.segmented button.sel{background:var(--card);color:var(--ink);}

.grid-rumah{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
.rumah{border-radius:10px;padding:10px 2px;text-align:center;font-size:9.5px;font-weight:700;color:#fff;}
.r-dihuni{background:var(--primary);} .r-kosong{background:var(--kosong-bg);} .r-sewa{background:var(--gold);} .r-kosongpemilik{background:var(--info);}
.r-belum{background:var(--belum-bg);color:var(--muted);border:1px dashed var(--line);}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}

.profile-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--serif);flex:0 0 auto;overflow:hidden;}
.avatar-lg{width:76px;height:76px;font-size:28px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.contact-row{display:flex;gap:8px;margin:10px 0 4px;}
.contact-row a,.contact-row button{flex:1;text-decoration:none;text-align:center;padding:10px;border-radius:10px;font-size:12.5px;font-weight:600;font-family:var(--sans);border:none;cursor:pointer;}
.contact-reject{background:var(--terra);color:#fff;}
.contact-muted{background:var(--line);color:var(--muted);}
.contact-call{background:var(--primary);color:var(--primary-ink);}
.contact-wa{background:#25D366;color:#fff;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:13px;}
.setting-row:first-of-type{border-top:none;}
.switch{width:38px;height:22px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;border:none;flex:0 0 auto;}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:.15s;}
.switch.on{background:var(--primary);} .switch.on i{left:18px;background:var(--primary-ink);}
.btn-ghost{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--terra);font-size:13px;font-weight:600;cursor:pointer;margin-top:14px;font-family:var(--sans);}

.note{background:var(--primary-ink);border:1px dashed var(--primary);color:var(--primary);border-radius:10px;padding:10px 12px;font-size:11.5px;margin-bottom:16px;}

.newscard{padding:0;overflow:hidden;}
.newscard img{width:100%;height:160px;object-fit:cover;display:block;background:var(--line);}
.newsbody{padding:14px 16px;}
.newsbody h3{font-size:16px;margin:0 0 4px;line-height:1.3;}
.newsbody p{font-size:13.5px;line-height:1.65;margin:0;text-align:justify;white-space:pre-line;}
.ai-badge{display:inline-block;font-size:10px;background:var(--primary-ink);color:var(--primary);padding:2px 8px;border-radius:20px;margin-bottom:8px;}
.ai-loading{display:block;font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:6px;}

.vote-row{display:flex;gap:8px;margin-top:10px;}
.vote-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:12px;cursor:pointer;color:var(--muted);font-family:var(--sans);}
.vote-btn.on.up{background:var(--primary-ink);border-color:var(--primary);color:var(--primary);font-weight:600;}
.vote-btn.on.down{background:#3a1f1a;border-color:var(--terra);color:#e2a396;font-weight:600;}
@media not (prefers-color-scheme: dark){ .vote-btn.on.down{background:#FBEAE6;color:var(--terra);} }
:root[data-theme="light"] .vote-btn.on.down{background:#FBEAE6;color:var(--terra);}

.exp-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;gap:10px;}
.exp-item:first-child{border-top:none;}
.exp-item .amt{color:var(--terra);white-space:nowrap;font-weight:600;font-size:13px;}

.overlay{display:none;position:fixed;inset:0;background:rgba(15,20,14,.5);z-index:60;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
.sheet img{width:100%;border-radius:10px;margin-bottom:10px;}
.close-x{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}

.denah-scroll{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:60vh;}
.denah-grid{display:grid;grid-template-columns:52px repeat(26,46px);grid-auto-rows:30px;gap:3px;width:max-content;}
.dg-cell{border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);text-align:center;line-height:1.1;padding:1px;}
.dg-cell:hover{border-color:var(--primary);filter:brightness(1.06);}
.dg-dihuni{background:var(--primary);color:#fff;border-color:var(--primary);}
.dg-sewa{background:var(--gold);color:#fff;border-color:var(--gold);}
.dg-kosongpemilik{background:var(--info);color:#fff;border-color:var(--info);}
.dg-kosong{background:var(--kosong-bg);color:#fff;border-color:var(--kosong-bg);}
.dg-belum{background:var(--belum-bg);color:var(--muted);border:1px dashed var(--line);}
.dg-fasum,.dg-lap{background:#BFE3C4;color:#1d4d29;border-radius:8px;font-size:9.5px;font-weight:700;text-align:center;line-height:1.2;cursor:default;}
.dg-pos{background:#F3CBAE;color:#7a3d1c;border-radius:8px;font-size:10px;font-weight:700;cursor:default;}

nav#tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;}
nav#tabbar button{flex:1;background:none;border:none;padding:10px 2px 8px;color:var(--muted);font-size:10px;cursor:pointer;font-family:var(--sans);position:relative;}
.badge-dot{position:absolute;top:4px;right:22%;background:var(--terra);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:10px;line-height:15px;padding:0 3px;display:none;}
nav#tabbar button .ic{display:block;font-size:19px;margin-bottom:2px;}
nav#tabbar button.active{color:var(--primary);font-weight:600;}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="mark">🏡</div>
    <h1>Alam Indah Selaras</h1>
    <p>Portal warga &amp; pengurus — Blok D</p>
    <div class="role-pick">
      <button id="pickWarga" class="sel">Saya Warga</button>
      <button id="pickPengurus">Saya Pengurus</button>
    </div>
    <input class="field" id="loginUser" autocomplete="username" placeholder="Username (Admin / Warga)">
    <div style="position:relative">
      <input class="field" id="loginPass" type="password" autocomplete="current-password" placeholder="Password" style="padding-right:42px">
      <button type="button" onclick="togglePassVisibility()" aria-label="Lihat password" style="position:absolute;right:2px;top:0;height:100%;width:38px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">👁</button>
    </div>
    <input class="field" id="loginRumah" placeholder="Nomor rumah (contoh: D2/12)">
    <button class="btn-primary" onclick="doLogin()">Masuk</button>
    <p class="login-foot">Login warga memakai akun unik dari Pengurus · Akun Admin dapat masuk langsung sebagai Pengurus dari pilihan mode apa pun.</p>
  </div>
</div>

<div id="app" class="hide">
<header>
  <div class="mark-sm">🏡</div>
  <div class="t"><h1>Alam Indah Selaras</h1><p>Blok D</p></div>
  <span id="roleTag">Warga</span>
</header>

<main>
  <div class="tab active" id="tab-beranda"></div>
  <div class="tab" id="tab-iuran"></div>
  <div class="tab" id="tab-info"></div>
  <div class="tab" id="tab-warga"></div>
  <div class="tab" id="tab-notif"></div>
  <div class="tab" id="tab-profil"></div>
</main>

<nav id="tabbar">
  <button data-t="beranda" class="active"><span class="ic">🏠</span>Beranda</button>
  <button data-t="iuran"><span class="ic">🧾</span>Iuran</button>
  <button data-t="info"><span class="ic">📣</span>Info</button>
  <button data-t="warga"><span class="ic">🧭</span>Warga</button>
  <button data-t="notif" id="navNotif" class="hide"><span class="ic">🔔</span>Notifikasi<span class="badge-dot" id="notifDot"></span></button>
  <button data-t="profil"><span class="ic">👤</span>Profil</button>
</nav>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------------- demo data ---------------- */
const bulan=['Jun','Jul','Ags','Sep'];
const bulanPendek=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
let berandaYear=new Date().getFullYear();
let keuangan=[
];
let pengumuman=[
];
let berita=[];
let aspirasi=[];
const uid=()=>Math.random().toString(36).slice(2,9);
function makeUniqueUsername(no){
  const base='Warga'+String(no||'').replace(/[^A-Za-z0-9]/g,'');
  let u=base || 'Warga'; let n=2;
  while(warga.some(x=>x.akun&&x.akun.username.toLowerCase()===u.toLowerCase())) u=base+n++;
  return u;
}
function makePassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  let out='AIS-';
  for(let i=0;i<6;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function ensureAccounts(){
  let changed=false;
  warga.forEach(w=>{
    if(!w.akun && w.status==='dihuni' && w.nama){
      w.akun={username:makeUniqueUsername(w.no),password:makePassword(),dibuat:new Date().toISOString().slice(0,10)};
      changed=true;
    }
  });
  if(changed) saveData();
}

let warga=[
];
let session={name:'',rumah:'',role:'warga'};
let notifikasi=[
];
let theme='auto';

/* ---------------- penyimpanan & helper keamanan V12 ---------------- */
const STORAGE_KEY='ais_blokd_v3';
const MAX_IMAGE_BYTES=2*1024*1024;
function isPengurus(){ return session.role==='pengurus'; }
function isOwnHouse(no){ return isPengurus() || session.rumah===no; }
function applyTheme(){
  document.documentElement.dataset.theme=theme==='dark'?'dark':theme==='light'?'light':'';
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({keuangan,pengumuman,berita,aspirasi,warga,notifikasi,pengurusList,theme,version:12}));
    return true;
  }catch(e){
    console.warn('Data belum tersimpan:',e);
    alert('Penyimpanan penuh. Kurangi ukuran foto/dokumen atau hapus data lama.');
    return false;
  }
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY) || localStorage.getItem('ais_blokd_v2');
    if(!raw){applyTheme();return;}
    const d=JSON.parse(raw);
    if(Array.isArray(d.keuangan))keuangan=d.keuangan;
    if(Array.isArray(d.pengumuman))pengumuman=d.pengumuman;
    if(Array.isArray(d.berita))berita=d.berita;
    if(Array.isArray(d.aspirasi))aspirasi=d.aspirasi;
    if(Array.isArray(d.warga))warga=d.warga;
    if(Array.isArray(d.notifikasi))notifikasi=d.notifikasi;
    if(Array.isArray(d.pengurusList)){
      // Gabungkan data tersimpan dengan daftar jabatan baku (jaga-jaga ada jabatan baru di versi mendatang)
      d.pengurusList.forEach(saved=>{const p=pengurusList.find(x=>x.id===saved.id); if(p) Object.assign(p,saved);});
    }
    if(d.theme)theme=d.theme;
    // Migrasi voting lama: status vote tidak lagi disimpan di a.my.
    aspirasi.forEach(a=>{ if(!a.votes)a.votes={}; delete a.my; });
    notifikasi.forEach(n=>{ if(n.type==='bayar' && n.hasil===null){ const w=warga.find(x=>x.no===n.rumah); const idx=w&&Array.isArray(w.iuran)?bulan.indexOf(n.bulan):-1; if(w&&idx>-1&&w.iuran[idx]==='belum')w.iuran[idx]='menunggu'; }});
    applyTheme();
  }catch(e){ console.warn('Data lokal tidak dapat dibaca:',e); }
}
loadData();
ensureAccounts();

/* ---------------- login ---------------- */
document.getElementById('pickWarga').onclick=()=>selRole('warga');
document.getElementById('pickPengurus').onclick=()=>selRole('pengurus');
function selRole(r){session.role=r;document.getElementById('pickWarga').classList.toggle('sel',r==='warga');document.getElementById('pickPengurus').classList.toggle('sel',r==='pengurus');}
function togglePassVisibility(){
  const f=document.getElementById('loginPass');
  const btn=event.currentTarget;
  const show=f.type==='password';
  f.type=show?'text':'password';
  btn.textContent=show?'🙈':'👁';
}
function doLogin(){
  const user=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value.trim();
  const rumah=document.getElementById('loginRumah').value.trim().toUpperCase();
  if(!user || !pass){ alert('Username dan password wajib diisi.'); return; }

  // MASTER ADMIN = bypass pilihan mode login.
  // Admin selalu masuk sebagai Pengurus, baik tombol "Saya Warga" maupun
  // "Saya Pengurus" yang sedang terpilih, dan nomor rumah boleh kosong/diisi.
  const u=user.normalize('NFKC').trim().toLowerCase();
  const p=pass.normalize('NFKC').trim();
  const isMasterAdmin=(u==='admin' && p.toUpperCase()==='AIS2026');

  if(isMasterAdmin){
    session={name:'Administrator Pengurus',rumah:'',role:'pengurus'};
  } else if(session.role==='pengurus'){
    alert('Username atau password pengurus salah. Gunakan akun Admin.'); return;
  } else {
    ensureAccounts();
    const w=warga.find(x=>x.akun && String(x.akun.username||'').normalize('NFKC').trim().toLowerCase()===u && String(x.akun.password||'').normalize('NFKC').trim()===p);
    if(!w){ alert('Username atau password warga salah. Minta Pengurus melihat atau reset akun warga kamu.'); return; }
    session.name=w.nama || ('Warga '+w.no); session.rumah=w.no; session.role='warga';
  }
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('roleTag').textContent=session.role==='pengurus'?'Pengurus':'Warga';
  document.getElementById('navNotif').classList.toggle('hide',session.role!=='pengurus');
  renderAll();
}

/* ---------------- nav ---------------- */
document.getElementById('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#tabbar button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-'+b.dataset.t));

const fmtRp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>(s??'').toString().replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function readFile(file){
  if(!file||!file.size)return '';
  if(file.size>MAX_IMAGE_BYTES){ alert('Ukuran gambar maksimal 2 MB.'); return ''; }
  if(!file.type.startsWith('image/')){ alert('File harus berupa gambar.'); return ''; }
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.78));
      };
      img.onerror=()=>resolve(r.result); img.src=r.result;
    };
    r.onerror=()=>resolve(''); r.readAsDataURL(file);
  });
}

function keuanganYears(){
  const ys=new Set(keuangan.filter(t=>t.tgl).map(t=>t.tgl.slice(0,4)));
  ys.add(String(new Date().getFullYear()));
  return [...ys].map(Number).sort((a,b)=>a-b);
}
function shiftBerandaYear(d){
  const ys=keuanganYears(), min=Math.min(...ys), max=Math.max(...ys);
  berandaYear=Math.min(max,Math.max(min,berandaYear+d));
  renderBeranda();
}
function abbrRp(n){
  if(!n) return '';
  if(n>=1000000) return (Math.round(n/100000)/10)+'jt';
  if(n>=1000) return Math.round(n/1000)+'rb';
  return String(n);
}
function kasByMonthYear(year){
  const arr=Array.from({length:12},()=>({masuk:0,keluar:0}));
  keuangan.forEach(t=>{
    if(!t.tgl||t.tgl.slice(0,4)!==String(year))return;
    const mi=parseInt(t.tgl.slice(5,7),10)-1;
    if(mi>=0&&mi<12) arr[mi][t.jenis]+=Number(t.jumlah)||0;
  });
  return arr;
}
function chartSVG(year){
  const data=kasByMonthYear(year);
  const max=Math.max(1,...data.map(d=>Math.max(d.masuk,d.keluar)));
  const groupW=52,barW=11,chartH=78,top=26,base=top+chartH;
  const width=12*groupW+16;
  let bars='';
  data.forEach((d,i)=>{
    const x=10+i*groupW, hm=(d.masuk/max)*chartH, hk=(d.keluar/max)*chartH;
    bars+=`<rect x="${x}" y="${base-hm}" width="${barW}" height="${hm}" rx="2" fill="var(--primary)"></rect>`;
    if(d.masuk) bars+=`<text x="${x+barW/2}" y="${base-hm-4}" font-size="7" fill="var(--primary)" text-anchor="middle" font-family="var(--sans)">${abbrRp(d.masuk)}</text>`;
    bars+=`<rect x="${x+barW+3}" y="${base-hk}" width="${barW}" height="${hk}" rx="2" fill="var(--gold)"></rect>`;
    if(d.keluar) bars+=`<text x="${x+barW+3+barW/2}" y="${base-hk-4}" font-size="7" fill="var(--gold)" text-anchor="middle" font-family="var(--sans)">${abbrRp(d.keluar)}</text>`;
    bars+=`<text x="${x+barW+1.5}" y="${base+11}" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="var(--sans)">${bulanPendek[i]}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${width} ${base+22}" height="140" style="min-width:${width*1.7}px;display:block">${bars}</svg></div>`;
}

  ${daftar.map((w,wi)=>`<tr><td class="who">${w.no}<small>${esc(w.nama)||'kosong'}</small></td>
    ${w.iuran.map((s,si)=>{
      if(s==='-') return `<td><span class="pill p-off">–</span></td>`;
      const own=!bisaEdit && w.no===session.rumah;
      return `<td><button class="pill ${s==='lunas'?'p-lunas':s==='menunggu'?'p-belum':'p-belum'}" ${own||bisaEdit?'':'disabled title="Hanya pemilik rumah yang dapat mengonfirmasi pembayaran"'} onclick="toggleIuran(${warga.indexOf(w)},${si})">${s==='lunas'?'✓ Lunas':s==='menunggu'?'⏳ Menunggu':'! Belum'}</button></td>`;
    }).join('')}
  </tr>`).join('')}
  </tbody></table></div>`;
}
function toggleIuran(wi,si){
  const w=warga[wi]; if(!w||!w.iuran)return;
  const cur=w.iuran[si]; if(cur==='-')return;
  if(isPengurus()){
    w.iuran[si]=cur==='lunas'?'belum':cur==='menunggu'?'lunas':'lunas';
    saveData();
  } else {
    if(w.no!==session.rumah){alert('Kamu hanya dapat mengonfirmasi iuran rumahmu sendiri.');return;}
    if(cur==='menunggu'){alert('Konfirmasi untuk bulan ini sudah menunggu verifikasi pengurus.');return;}
    if(cur==='lunas'){alert('Iuran bulan ini sudah tercatat lunas.');return;}
    w.iuran[si]='menunggu';
    if(localStorage.getItem('ais_tagihan_notif')!=='0') notifikasi.unshift({id:uid(),type:'bayar',rumah:w.no,nama:w.nama,bulan:bulan[si],tgl:new Date().toISOString().slice(0,10),read:false,hasil:null});
    saveData(); updateNotifBadge();
    alert('Konfirmasi bayar terkirim ke pengurus untuk diverifikasi.');
  }
  renderIuran();
}

        :b.ai?'<span class="ai-badge">✨ Ditulis ulang AI</span>':''}
      <h3>${esc(judul)}</h3>
      <div class="meta" style="margin-bottom:8px">Oleh ${esc(b.penulis)} · ${b.tgl}</div>
      <p>${esc(isi)}</p>
      ${bisaReview?`<div class="contact-row" style="margin-top:12px">
        <button class="contact-call" onclick="decideBerita('${b.id}',true)">✅ Setujui &amp; Publikasikan</button>
        <button class="contact-reject" onclick="decideBerita('${b.id}',false)">✕ Tolak</button>
      </div>`:''}
      ${session.role==='pengurus'&&b.status!=='pending'&&b.status!=='loading'?`<button type="button" onclick="hapusBerita('${b.id}')" style="margin-top:10px;background:none;border:none;color:var(--terra);font-size:11.5px;cursor:pointer;font-family:var(--sans);padding:0">🗑 Hapus berita ini</button>`:''}
    </div></div>`;
}
function hapusBerita(id){
  const b=berita.find(x=>x.id===id); if(!b)return;
  if(!confirm('Hapus berita ini? Tindakan ini tidak bisa dibatalkan.'))return;
  berita=berita.filter(x=>x.id!==id);
  saveData(); renderInfo();
}
function decideBerita(id,approve){
  const b=berita.find(x=>x.id===id); if(!b)return;
  b.status=approve?'published':'rejected';
  const n=notifikasi.find(x=>x.beritaId===id); if(n){n.read=true;n.hasil=approve?'terbit':'tolak';}
  saveData(); renderInfo(); renderNotifikasi(); updateNotifBadge();
}
async function aiRewriteBerita(id){
  const b=berita.find(x=>x.id===id); if(!b)return;
  try{
    if(window.claude&&window.claude.use){
      const sample=await window.claude.use('sample');
      if(sample){
        const prompt='Kamu editor berita warga. Ubah catatan warga berikut menjadi artikel berita singkat bergaya media online Indonesia (seperti detik.com): judul menarik maksimal 12 kata, isi 2 paragraf naratif berbahasa baku tapi renyah, jangan mengarang fakta baru. Balas HANYA JSON valid tanpa markdown: {"judul":"...","isi":"..."}. Catatan asli warga: "'+b.raw.replace(/"/g,"'")+'"';
        const res=await sample.json(prompt);
        if(res&&res.judul&&res.isi) b.ai=res;
      }
    }
  }catch(e){ /* gagal -> tampilkan versi asli */ }
  b.status='pending'; saveData(); renderInfo(); renderNotifikasi(); updateNotifBadge();
}
function submitBerita(e){
  e.preventDefault();
  const fd=new FormData(e.target); const file=fd.get('foto'); const id=uid();
  const item={id,penulis:(session.name||'Warga')+' ('+(session.rumah||'-')+')',tgl:new Date().toISOString().slice(0,10),raw:fd.get('isi'),foto:'',ai:null,status:'loading'};
  berita.unshift(item);
  notifikasi.unshift({id:uid(),type:'berita',penulis:item.penulis,judul:item.raw.length>50?item.raw.slice(0,50)+'…':item.raw,tgl:item.tgl,read:false,beritaId:id});
  saveData(); updateNotifBadge(); renderInfo();
  const go=()=>aiRewriteBerita(id);
  if(file&&file.size>0){readFile(file).then(data=>{item.foto=data;saveData();go();});} else go();
}

function aspirasiCard(a){
  const bisaLihat=session.role==='pengurus';
  const myVote=(a.votes&&session.rumah)?a.votes[session.rumah]:null;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(a.nama)}</b>${bisaLihat?`<button type="button" onclick="hapusAspirasi('${a.id}')" style="background:none;border:none;color:var(--terra);font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap">🗑 Hapus</button>`:''}</div>
    <div class="meta">${a.tgl}</div>
    <p style="font-size:13.5px;margin:8px 0 0">${esc(a.isi)}</p>
    <div class="vote-row">
      <button class="vote-btn up ${myVote==='up'?'on':''}" onclick="vote('${a.id}','up')">👍 Setuju (${a.up})</button>
      <button class="vote-btn down ${myVote==='down'?'on':''}" onclick="vote('${a.id}','down')">👎 Tidak Setuju (${a.down})</button>
    </div>
    ${bisaLihat&&((a.setujuNama&&a.setujuNama.length)||(a.tidakNama&&a.tidakNama.length))?`<div class="meta" style="margin-top:10px;line-height:1.7;padding-top:8px;border-top:1px solid var(--line)">
      ${a.setujuNama&&a.setujuNama.length?`<b style="color:var(--primary)">Setuju:</b> ${a.setujuNama.map(esc).join(', ')}<br>`:''}
      ${a.tidakNama&&a.tidakNama.length?`<b style="color:var(--terra)">Tidak setuju:</b> ${a.tidakNama.map(esc).join(', ')}`:''}
    </div>`:''}
  </div>`;
}
function hapusAspirasi(id){
  const a=aspirasi.find(x=>x.id===id); if(!a)return;
  if(!confirm('Hapus aspirasi ini?'))return;
  aspirasi=aspirasi.filter(x=>x.id!==id);
  saveData(); renderInfo();
}
function vote(id,dir){
  const a=aspirasi.find(x=>x.id===id); if(!a||!session.rumah)return;
  if(!a.votes)a.votes={};
  const voterKey=session.rumah; const old=a.votes[voterKey]||null;
  if(old===dir){ a[dir]--; delete a.votes[voterKey]; }
  else {
    if(old){a[old]--; }
    a[dir]++; a.votes[voterKey]=dir;
  }
  // Nama voting tetap hanya ditampilkan ke Pengurus.
  a.setujuNama=[]; a.tidakNama=[];
  Object.entries(a.votes).forEach(([rumah,v])=>{const w=warga.find(x=>x.no===rumah); const label=w?(w.nama+' ('+rumah+')'):rumah; (v==='up'?a.setujuNama:a.tidakNama).push(label);});
  saveData(); renderInfo();
}

}

const HAPUS_LOG_KEY='ais_hapus_log_v1';
function getHapusLog(){
  let arr=[]; try{arr=JSON.parse(localStorage.getItem(HAPUS_LOG_KEY)||'[]');}catch(e){arr=[];}
  const now=new Date();
  const fresh=arr.filter(e=>{const d=new Date(e.tgl+'T00:00:00');if(isNaN(d))return false;return (now-d)/86400000<=366;});
  if(fresh.length!==arr.length) localStorage.setItem(HAPUS_LOG_KEY, JSON.stringify(fresh));
  return fresh;
}
function tambahHapusLog(foto){
  const log=getHapusLog();
  log.unshift({tgl:new Date().toISOString().slice(0,10),jam:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),foto});
  localStorage.setItem(HAPUS_LOG_KEY, JSON.stringify(log));
}

function showResetCamFallback(msg){

async function startResetCamera(){
  const box=document.getElementById('resetCamBox');
  const statusEl=document.getElementById('resetFaceStatus');
  if(statusEl) statusEl.textContent='';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showResetCamFallback('Kamera langsung tidak didukung di tampilan ini.');
    return;
  }
  try{
    stopResetCamera();
    resetStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});
    box.innerHTML=`<video id="resetVideo" autoplay playsinline muted style="width:100%;max-width:260px;border-radius:12px;display:block;margin:0 auto;transform:scaleX(-1);background:#000"></video>
      <button type="button" class="btn-primary" style="margin-top:10px" onclick="captureResetPhoto()">📸 Ambil Foto</button>`;
    const v=document.getElementById('resetVideo'); v.srcObject=resetStream;
    try{ await v.play(); }catch(e){}
  }catch(e){
    stopResetCamera();
    const alasan=(e&&e.name==='NotAllowedError')?'Izin kamera ditolak.':'Kamera tidak bisa dibuka.';
    showResetCamFallback(alasan);
  }
}
async function captureResetPhoto(){
  const v=document.getElementById('resetVideo');
  if(!v||!v.videoWidth){alert('Kamera belum siap, tunggu sebentar lalu coba lagi.');return;}
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  const ctx=c.getContext('2d'); ctx.translate(c.width,0); ctx.scale(-1,1); ctx.drawImage(v,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',0.8);
  stopResetCamera();
  document.getElementById('resetCamBox').innerHTML='<button type="button" class="btn-ghost" onclick="startResetCamera()">🔄 Foto Ulang</button>';
  await processResetPhoto(data);
}
async function handleResetFoto(input){
  const file=input.files[0]; if(!file)return;
  const data=await readFile(file); if(!data)return;
  const box=document.getElementById('resetCamBox');
  if(box) box.innerHTML='<button type="button" class="btn-ghost" onclick="startResetCamera()">🔄 Foto Ulang</button>';
  await processResetPhoto(data);
}
async function processResetPhoto(data){
  resetState.photoData=data; resetState.faceOk=false;
  document.getElementById('resetFotoPreview').innerHTML=`<img src="${data}" style="width:120px;height:120px;border-radius:10px;object-fit:cover;display:block;margin:0 auto">`;
  const statusEl=document.getElementById('resetFaceStatus');
  statusEl.style.color='var(--muted)'; statusEl.textContent='Memuat sistem deteksi wajah…';
  updateResetSubmitState();
  const modelReady=await ensureFaceModels();
  if(!modelReady){
    resetState.faceOk=false;
    statusEl.style.color='var(--terra)'; statusEl.textContent='❌ Gagal memuat sistem deteksi wajah. Pastikan HP terhubung internet, lalu coba lagi.';
    updateResetSubmitState(); return;
  }
  statusEl.textContent='Memeriksa wajah…';
  try{
    const img=new Image(); img.src=data; await img.decode();
    const detection=await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions());
    if(detection){
      resetState.faceOk=true;
      statusEl.style.color='var(--primary)'; statusEl.textContent='✅ Wajah terdeteksi.';
    } else {
      resetState.faceOk=false;
      statusEl.style.color='var(--terra)'; statusEl.textContent='❌ Wajah tidak terdeteksi. Pastikan wajah terlihat jelas & pencahayaan cukup, lalu foto ulang.';
    }
  }catch(e){
    resetState.faceOk=false;
    statusEl.style.color='var(--terra)'; statusEl.textContent='❌ Gagal memeriksa wajah, coba foto ulang.';
  }
  updateResetSubmitState();
}
function updateResetSubmitState(){

  btn.disabled=!(pass.trim() && resetState.faceOk && resetState.photoData);

function downloadExcel(){
  if(!isPengurus()){alert('Hanya Pengurus yang dapat mengunduh data.');return;}
  if(!window.XLSX){ alert('Modul Excel belum termuat (butuh koneksi internet). Coba lagi.'); return; }
  const wb=XLSX.utils.book_new();
  const totalMasuk=keuangan.filter(t=>t.jenis==='masuk').reduce((a,t)=>a+t.jumlah,0);
  const totalKeluar=keuangan.filter(t=>t.jenis==='keluar').reduce((a,t)=>a+t.jumlah,0);
  const semuaKode=allBlokCodes();
  const lunas=warga.filter(w=>w.iuran&&w.iuran[3]==='lunas').length;
  const wajibIuran=warga.filter(w=>w.iuran&&w.iuran[3]!=='-').length;
  const ringkasan=[
    {Keterangan:'Total Pemasukan (Rp)',Nilai:totalMasuk},
    {Keterangan:'Total Pengeluaran (Rp)',Nilai:totalKeluar},
    {Keterangan:'Saldo Kas (Rp)',Nilai:totalMasuk-totalKeluar},
    {Keterangan:'Rumah Milik Pribadi (dihuni)',Nilai:warga.filter(w=>w.status==='dihuni'&&w.kepemilikan==='milik').length},
    {Keterangan:'Rumah Ngontrak (dihuni)',Nilai:warga.filter(w=>w.status==='dihuni'&&w.kepemilikan==='sewa').length},
    {Keterangan:'Rumah Kosong - Ada Pemilik',Nilai:warga.filter(w=>w.status==='kosong-pemilik').length},
    {Keterangan:'Rumah Kosong - Belum Ada Pemilik',Nilai:warga.filter(w=>w.status==='kosong-belum').length},
    {Keterangan:'Total Unit Tercatat di Sistem',Nilai:warga.length},
    {Keterangan:'Total Unit di Komplek (D1,D2,D3,D5)',Nilai:semuaKode.length},
    {Keterangan:'Rumah Lunas Iuran Bulan Ini',Nilai:lunas+' dari '+wajibIuran},
    {Keterangan:'Jumlah Aspirasi Masuk',Nilai:aspirasi.length},
    {Keterangan:'Tanggal Export',Nilai:new Date().toISOString().slice(0,10)},
  ];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ringkasan),'Ringkasan');
  const keuanganRows=[...keuangan].sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(t=>({
    Tanggal:t.tgl,Jenis:t.jenis==='masuk'?'Pemasukan':'Pengeluaran',Keterangan:t.judul,'Jumlah (Rp)':t.jumlah,Catatan:t.catatan||''
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(keuanganRows),'Keuangan');
  const aspirasiRows=aspirasi.map(a=>({
    Tanggal:a.tgl,Pengirim:a.nama,Isi:a.isi,'Jumlah Setuju':a.up,'Jumlah Tidak Setuju':a.down,
    'Nama yang Setuju':(a.setujuNama||[]).join(', '),'Nama yang Tidak Setuju':(a.tidakNama||[]).join(', ')
  }));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(aspirasiRows),'Aspirasi Warga');
  const wargaRows=semuaKode.map(no=>{
    const w=warga.find(x=>x.no===no);
    if(!w) return {'No Rumah':no,'Status':'Belum ada data','Kepemilikan':'-','Nama Penghuni':'-','No HP Penghuni':'-','Pemilik':'-','No HP Pemilik':'-','Iuran Jun':'-','Iuran Jul':'-','Iuran Ags':'-','Iuran Sep':'-'};
    return {
      'No Rumah':w.no,
      'Status':w.status==='dihuni'?'Dihuni':w.status==='kosong-pemilik'?'Kosong - Ada Pemilik':'Kosong - Belum Ada Pemilik',
      'Kepemilikan':w.status==='dihuni'?(w.kepemilikan==='sewa'?'Ngontrak':'Milik Pribadi'):'-',
      'Nama Penghuni':w.nama||'-','No HP Penghuni':w.telp||'-',
      'Pemilik':w.pemilik||'-','No HP Pemilik':w.telpPemilik||'-',
      ['Iuran '+(bulan[0]||'1')]:(w.iuran&&w.iuran[0])||'-',['Iuran '+(bulan[1]||'2')]:(w.iuran&&w.iuran[1])||'-',
      ['Iuran '+(bulan[2]||'3')]:(w.iuran&&w.iuran[2])||'-',['Iuran '+(bulan[3]||'4')]:(w.iuran&&w.iuran[3])||'-',
    };
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wargaRows),'Data Warga');
  XLSX.writeFile(wb,'Data-AlamIndahSelaras-BlokD-'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function toggleTagihanNotif(){localStorage.setItem('ais_tagihan_notif',localStorage.getItem('ais_tagihan_notif')==='0'?'1':'0');renderProfil();}
function toggleTheme(){theme=(theme==='dark'?'light':'dark');applyTheme();saveData();renderProfil();}
function logout(){session={name:'',rumah:'',role:'warga'}; document.getElementById('loginUser').value=''; document.getElementById('loginPass').value=''; document.getElementById('loginRumah').value=''; document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide');}

function renderAll(){renderBeranda();renderIuran();renderInfo();renderWarga();renderNotifikasi();renderProfil();updateNotifBadge();saveData();}

/* ---------------- notifikasi (khusus pengurus) ---------------- */
function updateNotifBadge(){
  const dot=document.getElementById('notifDot'); if(!dot)return;
  const c=notifikasi.filter(n=>!n.read).length;
  dot.textContent=c>0?c:''; dot.style.display=c>0?'inline-block':'none';
}
function markRead(id){if(!isPengurus())return;const n=notifikasi.find(x=>x.id===id); if(n)n.read=true; saveData(); renderNotifikasi(); updateNotifBadge();}
function resolveNotif(id,approve){
  if(!isPengurus()){alert('Hanya Pengurus yang dapat memverifikasi notifikasi.');return;}
  const n=notifikasi.find(x=>x.id===id); if(!n)return;
  if(approve){
    const w=warga.find(x=>x.no===n.rumah);
    if(w){ const idx=bulan.indexOf(n.bulan); if(idx>-1) w.iuran[idx]='lunas'; }
    n.hasil='verif';
  } else { const w=warga.find(x=>x.no===n.rumah); if(w){const idx=bulan.indexOf(n.bulan);if(idx>-1)w.iuran[idx]='belum';} n.hasil='tolak'; }
  n.read=true;
  saveData();
  renderNotifikasi(); renderIuran(); renderBeranda(); updateNotifBadge();
}
function lihatBerita(id){
  infoView='berita';
  document.querySelectorAll('#tabbar button').forEach(x=>x.classList.toggle('active',x.dataset.t==='info'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-info'));
  renderInfo();
}
function notifItem(n){
  if(n.type==='bayar'){
    return `<div class="item">
      <b>Konfirmasi pembayaran — Rumah ${n.rumah}</b>
      <div class="meta">${esc(n.nama)} mengonfirmasi bayar iuran bulan ${n.bulan} · ${n.tgl}</div>
      ${n.read?`<div class="meta" style="margin-top:6px;color:${n.hasil==='verif'?'var(--primary)':'var(--terra)'}">${n.hasil==='verif'?'✓ Sudah diverifikasi':'✕ Ditolak'}</div>`
      :`<div class="contact-row" style="margin-top:8px">
        <button class="contact-call" onclick="resolveNotif('${n.id}',true)">✅ Verifikasi</button>
        <button class="contact-reject" onclick="resolveNotif('${n.id}',false)">✕ Tolak</button>
      </div>`}
    </div>`;
  }
  return `<div class="item">
    <b>Berita baru — menunggu persetujuan</b>
    <div class="meta">${esc(n.penulis)} mengirim: "${esc(n.judul)}" · ${n.tgl}</div>
    ${n.read?`<div class="meta" style="margin-top:6px;color:${n.hasil==='terbit'?'var(--primary)':'var(--terra)'}">${n.hasil==='terbit'?'✓ Sudah dipublikasikan':'✕ Ditolak'}</div>`
    :`<div class="contact-row" style="margin-top:8px">
      <button class="contact-call" onclick="lihatBerita('${n.id}')">📰 Tinjau &amp; putuskan</button>
    </div>`}
  </div>`;
}
function renderNotifikasi(){
  const el=document.getElementById('tab-notif'); if(!el)return;
  const list=[...notifikasi].sort((a,b)=>(a.read?1:0)-(b.read?1:0));
  el.innerHTML=`<div class="section-title">Notifikasi pengurus</div>
  <div class="card">${list.map(notifItem).join('')||'<div class="empty">Belum ada notifikasi</div>'}</div>`;
}
